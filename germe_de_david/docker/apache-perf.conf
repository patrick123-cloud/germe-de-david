ServerTokens Prod
ServerSignature Off
<IfModule mod_deflate.c>
  AddOutputFilterByType DEFLATE text/html text/css application/javascript image/svg+xml text/csv
</IfModule>
<IfModule mod_expires.c>
  ExpiresActive On
  ExpiresByType text/css "access plus 30 days"
  ExpiresByType application/javascript "access plus 30 days"
  ExpiresByType image/svg+xml "access plus 30 days"
  ExpiresByType image/jpeg "access plus 30 days"
  ExpiresByType image/png "access plus 30 days"
  ExpiresByType image/webp "access plus 30 days"
</IfModule>
# Les CSS/JS sont appelés avec ?v=<date du fichier> : un nouveau déploiement force le rechargement.
<IfModule mod_headers.c>
  <FilesMatch "\.(css|js|svg|jpe?g|png|webp)$">
    Header set Cache-Control "public, max-age=2592000"
  </FilesMatch>
</IfModule>
# Les .htaccess sont ignorés par défaut dans l'image Docker : on protège donc uploads/ ici.
<Directory /var/www/html/uploads>
  Options -Indexes
  <FilesMatch "\.(php|phtml|php[0-9]?)$">
    Require all denied
  </FilesMatch>
</Directory>
